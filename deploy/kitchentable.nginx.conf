map $http_upgrade $kitchentable_connection {
    default upgrade;
    '' close;
}

server {
    listen 9443 ssl;
    listen [::]:9443 ssl;
    server_name gagarinbefree.clodocd.com;
    ssl_certificate /etc/letsencrypt/live/weatherserver-api/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weatherserver-api/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kitchentable_connection;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
