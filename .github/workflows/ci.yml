name: Test, build and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: kitchentable-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: Build Docker image and test server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: bash ci/linux-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tested-server
          path: ${{ runner.temp }}/kitchentable-image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  android:
    name: Test Flutter and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: {flutter-version: '3.50.1', channel: stable, cache: true}
      - name: Analyze and test Flutter
        working-directory: client
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded
      - run: bash ci/android-build.sh debug
      - uses: actions/upload-artifact@v4
        with:
          name: KitchenTable-debug-x64
          path: client/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  messaging:
    name: Android private messaging and restart
    needs: [server, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ephemeral-ci-only
      CHAT_BIND: 127.0.0.1
      CHAT_PORT: '28788'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: tested-server
          path: ${{ runner.temp }}/image
      - uses: actions/download-artifact@v4
        with:
          name: KitchenTable-debug-x64
          path: ${{ runner.temp }}/apk
      - name: Start tested server and enable emulator acceleration
        run: |
          docker load -i "$RUNNER_TEMP/image/kitchentable-image.tar.gz"
          docker compose -p kitchentable-actions -f compose.yaml -f ci/compose.yaml up -d --no-build db server
          curl -fsS --retry 25 --retry-all-errors --retry-delay 1 --max-time 3 http://127.0.0.1:28788/health
          sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: bash ci/android-smoke.sh

  sign:
    name: Sign Android release
    needs: messaging
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: android-signing
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: {flutter-version: '3.50.1', channel: stable, cache: true}
      - run: bash ci/android-build.sh release
        env:
          KT_STORE_BASE64: ${{ secrets.ANDROID_KEYSTORE }}
          KT_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: KitchenTable-Android
          path: client/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          compression-level: 0

  deploy:
    name: Deploy server over HTTPS
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://gagarinbefree.clodocd.com:9443/health
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: tested-server
          path: ${{ runner.temp }}/image
      - run: docker load -i "$RUNNER_TEMP/image/kitchentable-image.tar.gz"
      - run: bash ci/deploy.sh
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST_KEYS: ${{ secrets.DEPLOY_HOST_KEYS }}

  release:
    name: Publish Android release
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: KitchenTable-Android}
      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mv app-release.apk KitchenTable-Android.apk
          tag="v1.0.$GITHUB_RUN_NUMBER"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" KitchenTable-Android.apk --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" KitchenTable-Android.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "KitchenTable $tag" --generate-notes
          fi
